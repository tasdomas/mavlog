[package]
name = "mavlog"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
chrono = "0.4.45"
crossterm = "0.29.0"
eframe = "0.35.0"
egui_extras = "0.35.0"
egui_plot = "0.36.0"
mavlink = { version = "0.18.0", default-features = false, features = ["std", "dialect-ardupilotmega", "serde"] }
ratatui = "0.30.2"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
