[package]
name = "mavlog"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
chrono = "0.4.45"
crossterm = "0.29.0"
eframe = "0.35.0"
egui_extras = "0.35.0"
egui_plot = "0.36.0"
image = { version = "0.25", default-features = false, features = ["png"] }
mavlink = { version = "0.18.0", default-features = false, features = ["std", "dialect-ardupilotmega", "serde"] }
ratatui = "0.30.2"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# macOS only: repoint the winit-provided menu's Quit item so Cmd+Q routes
# through the window's close request (and our unsaved-changes guard) instead of
# terminating the process outright. Versions match what winit 0.30 already
# pulls in, so no duplicate objc2 builds are introduced. See gui::macos.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = "0.2.2"
